name: Build
on:
  workflow_dispatch:
    inputs:
      test_release:
        description: 'Package unsigned UTM-HV.ipa + UTM.deb (set true)'
        required: true
        default: 'false'

concurrency:
  group: ios-build
  cancel-in-progress: false

env:
  BUILD_XCODE_PATH: ${{ vars.HOST_XCODE_PATH || '/Applications/Xcode_26.0.app' }}
  RUNNER_IMAGE: macos-15
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 60
  STATE_CACHE_KEY: ios-buildstate-v4

jobs:
  build:
    name: Build UTM-HV (iOS, ipa + deb)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Setup Xcode
        shell: bash
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          [[ "$(xcode-select -p)" == "${{ env.BUILD_XCODE_PATH }}"* ]] || sudo xcode-select -s "${{ env.BUILD_XCODE_PATH }}"
          xcodebuild -version
      - name: Restore build state (resume previous run)
        id: cache-state
        uses: actions/cache/restore@v4
        with:
          path: |
            build-iOS-arm64
            sysroot-iOS-arm64
          key: ${{ env.STATE_CACHE_KEY }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.STATE_CACHE_KEY }}-
      - name: Setup Path
        shell: bash
        run: |
          echo "/usr/local/opt/bison/bin:/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
      - name: Install Requirements
        run: |
          brew uninstall cmake
          brew install bison pkg-config gettext glib-utils libgpg-error nasm make meson cmake
          brew install llvm spirv-llvm-translator libxcb libxrandr libclc glslang
          pip3 install --break-system-packages --user six pyparsing pyyaml setuptools distlib mako
          gem install --user-install xcpretty
          rm -f /usr/local/lib/pkgconfig/*.pc
      - name: Provide libclc pkg-config + kernels for mesa
        run: |
          # mesa's host mesa_clc build needs a libclc pkg-config file whose
          # libexecdir points at its spirv*-mesa3d-.spv kernels. Homebrew's
          # libclc 23.x ships neither, so synthesise both in locations that
          # still resolve under the host build's `env -i PATH=...`. Our
          # Vulkan-only iOS config never runs mesa_clc, so placeholder kernels
          # are sufficient.
          LIBCLC_PREFIX="$(brew --prefix libclc)"
          STAGE=/opt/homebrew/share/libclc-mesa
          PC_DIR=/opt/homebrew/lib/pkgconfig
          mkdir -p "$STAGE" "$PC_DIR"
          for bits in 32 64; do
            SRC="$LIBCLC_PREFIX/share/clc/spirv${bits}-unknown-unknown/libclc.bc"
            OUT="$STAGE/spirv${bits}-mesa3d-.spv"
            if [ -f "$SRC" ] && command -v llvm-spirv >/dev/null 2>&1; then
              llvm-spirv --binary "$SRC" -o "$OUT" || cp "$SRC" "$OUT"
            else
              : > "$OUT"
            fi
          done
          cat > "$PC_DIR/libclc.pc" <<EOF
          prefix=$LIBCLC_PREFIX
          libexecdir=$STAGE
          includedir=$LIBCLC_PREFIX/include

          Name: libclc
          Description: OpenCL C library for mesa
          Version: 23.1.0
          EOF
          echo "--- $PC_DIR/libclc.pc"; cat "$PC_DIR/libclc.pc"
          ls -la "$STAGE"
          pkg-config --variable=libexecdir libclc
      - name: Build Sysroot
        run: |
          ARGS=""
          if [ -f build-iOS-arm64/BUILD_SUCCESS ]; then
            echo "previous successful build found -> incremental (-r)"
            ARGS="-r"
          fi
          if ! ./scripts/build_dependencies.sh $ARGS -p ios -a arm64 > /tmp/sysroot-build.log 2>&1; then
            echo "==== last 200 lines of build_dependencies.sh output ===="
            tail -200 /tmp/sysroot-build.log
            echo "===="
            exit 1
          fi
      - name: Save build state
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            build-iOS-arm64
            sysroot-iOS-arm64
          key: ${{ env.STATE_CACHE_KEY }}-${{ github.run_id }}
          upload-chunk-size: 1048576 # 1 MiB
      - name: Build UTM (archive)
        run: |
          ./scripts/build_utm.sh -k iphoneos -s iOS -a arm64 -o UTM
          tar -acf UTM.xcarchive.tgz UTM.xcarchive
      - name: Upload UTM.xcarchive
        uses: actions/upload-artifact@v4
        with:
          name: UTM.xcarchive.tgz
          path: UTM.xcarchive.tgz
      - name: Install ldid + dpkg
        if: github.event.inputs.test_release == 'true'
        run: brew install ldid dpkg
      - name: Package UTM-HV.ipa (ipa-hv)
        if: github.event.inputs.test_release == 'true'
        run: ./scripts/package.sh ipa-hv UTM.xcarchive .
      - name: Upload UTM-HV.ipa
        if: github.event.inputs.test_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: UTM-HV.ipa
          path: UTM.ipa
      - name: Package UTM.deb
        if: github.event.inputs.test_release == 'true'
        run: ./scripts/package.sh deb UTM.xcarchive .
      - name: Upload UTM.deb
        if: github.event.inputs.test_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: UTM.deb
          path: UTM.deb
